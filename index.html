<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100" style="background-image: url('emi1.jpg'); background-repeat: no-repeat; background-size: cover; background-position: center center;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-4">
                <div class="card p-4 shadow rounded-4 bg-warning-subtle text-warning-emphasis">
                    <h4 class="text-center mb-3">EMI Calculator</h4>
                    
                    <div class="mb-3">
                        <label for="AmountInput" class="form-label">Enter Amount:</label>
                        <input type="number" class="form-control" id="AmountInput" placeholder="e.g. 10000">
                    </div>

                    <div class="mb-3">
                        <label for="ROIInput" class="form-label">Enter Rate of Interest:</label>
                        <input type="number" class="form-control" id="ROIInput" placeholder="e.g. 7">
                    </div>

                    <div class="mb-3">
                        <label for="durationInput" class="form-label">Enter Duration:</label>
                        <input type="number" class="form-control" id="durationInput" placeholder="e.g. 10">
                    </div>

                    <button class="btn btn-warning w-100">Convert</button>

                    <div class="mt-3">
                        <p id="errMsg" class="fw-bold text-success"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="emi.js" type="module"></script>
</body>
</html>
